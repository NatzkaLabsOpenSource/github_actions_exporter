---
version: "2"
linters:
  enable:
    - asciicheck
    - errcheck
    - errorlint
    - gosec
    - gocritic
    - importas
    - prealloc
    - revive
    - misspell
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - whitespace
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
formatters:
  enable:
    - gofmt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
run:
  issues-exit-code: 1
  timeout: 10m
